services:
  - type: web
    name: studymate
    runtime: docker
    plan: starter            # a persistent disk needs a paid instance
    healthCheckPath: /healthz
    disk: { name: data, mountPath: /data, sizeGB: 1 }
    envVars:
      - { key: BOT_TOKEN, sync: false }
      - { key: OWNER_ID, sync: false }
      - { key: PUBLIC_URL, sync: false }
      - { key: STORAGE_CHANNEL_ID, sync: false }
      - { key: WEBHOOK_SECRET, generateValue: true }
