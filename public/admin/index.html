<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Management Panel</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="../shared/fonts.css">
<style>
:root{
  --bg:#0a0b16;--bg2:#0f1020;--card:#16172b;--card2:#1b1c33;--line:#26284a;--line2:#303360;
  --text:#ecebf8;--muted:#8a8bb0;--dim:#5d5f86;
  --pri:#7c7be6;--pri2:#6a6ee8;--priSoft:rgba(124,123,230,.14);
  --green:#2fb67f;--greenSoft:rgba(47,182,127,.14);--amber:#f0a030;--amberSoft:rgba(240,160,48,.14);
  --red:#e5484d;--redSoft:rgba(229,72,77,.14);--rose:#a8385c;--blue:#2f7cc4;
  --r:18px;--rs:12px;--shadow:0 10px 30px rgba(0,0,0,.35);
}
:root[data-theme=light]{--bg:#f2f3fb;--bg2:#fff;--card:#fff;--card2:#f4f5fc;--line:#dfe1f2;--line2:#c9ccea;--text:#191a33;--muted:#65678f;--dim:#9a9cc0;--shadow:0 8px 24px rgba(60,60,120,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
body{display:flex;justify-content:center}
button,input,select,textarea{font:inherit;color:inherit}
#app{width:100%;max-width:640px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
/* header */
.hdr{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0}
.hdr .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#4b3fa8,#3a3485);display:grid;place-items:center;font-weight:700;color:#fff}
.hdr .who{flex:1;min-width:0}.hdr .who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hdr .who span{font-size:12px;color:var(--muted)}
.hbtn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;font-size:11px;color:var(--muted);cursor:pointer}
.hbtn i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--pri);color:#fff}
.sheet{position:relative}.sheet .sx{position:absolute;right:12px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--card2,rgba(255,255,255,.08));color:var(--muted);display:grid;place-items:center;font-size:18px;cursor:pointer}.hbtn.red i{background:var(--red)}
/* body */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 96px;-webkit-overflow-scrolling:touch}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--bg2);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--dim);cursor:pointer;position:relative;padding:4px 0}
.nav button i{font-size:24px}.nav button.on{color:var(--pri)}.nav button.on:after{content:'';width:5px;height:5px;border-radius:50%;background:var(--pri);position:absolute;bottom:-6px}
/* segmented pill tabs */
.seg{display:flex;gap:4px;padding:5px;border:1px solid var(--line);border-radius:18px;background:var(--bg2);margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;min-width:max-content;border:0;background:none;color:var(--muted);padding:12px 14px;border-radius:14px;cursor:pointer;font-weight:600;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:7px}
.seg button.on{background:linear-gradient(135deg,#5f6df0,#8a7fe6);color:#fff;box-shadow:0 6px 18px rgba(106,110,232,.4)}
.seg.amber button.on{background:linear-gradient(135deg,#f6b445,#e0861d)}.seg.rose button.on{background:linear-gradient(135deg,#a8385c,#8a2e4d)}
/* title row */
.trow{display:flex;align-items:center;gap:14px;margin:4px 0 16px}
.sqb{width:52px;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--bg2);display:grid;place-items:center;font-size:22px;cursor:pointer;flex-shrink:0;color:var(--text)}
.trow h2{margin:0;font-size:22px;font-weight:700}.trow p{margin:2px 0 0;color:var(--muted);font-size:14px}
.trow .grow{flex:1;min-width:0}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.rowc{position:relative;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 14px 16px 20px;margin-bottom:12px;cursor:pointer;overflow:hidden;transition:transform .15s,border-color .15s}
.rowc:active{transform:scale(.985)}.rowc:before{content:'';position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(#6a6ee8,#8a7fe6)}
.rowc.green:before{background:var(--green)}.rowc.amber:before{background:var(--amber)}.rowc.red:before{background:var(--red)}.rowc.dim:before{background:var(--dim)}
.avc{width:58px;height:58px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:20px;font-weight:700;color:#fff;background:linear-gradient(145deg,#8a82ee,#5d54c4);border:2px solid rgba(255,255,255,.18);box-shadow:0 6px 16px rgba(80,70,200,.35);overflow:hidden}
.avc img{width:100%;height:100%;object-fit:cover}
.rowc .mid{flex:1;min-width:0}.rowc .nm{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:13px;border:1px solid var(--line2);color:var(--muted);background:var(--card2);white-space:nowrap}
.chip.pri{color:var(--pri);border-color:rgba(124,123,230,.5);background:var(--priSoft)}.chip.green{color:var(--green);border-color:rgba(47,182,127,.5);background:var(--greenSoft)}
.chip.amber{color:var(--amber);border-color:rgba(240,160,48,.5);background:var(--amberSoft)}.chip.red{color:var(--red);border-color:rgba(229,72,77,.5);background:var(--redSoft)}
.chev{width:42px;height:42px;border-radius:50%;background:var(--priSoft);color:var(--pri);display:grid;place-items:center;flex-shrink:0}
.hero{position:relative;border:1px solid var(--line2);border-radius:24px;padding:20px;margin-bottom:14px;background:linear-gradient(135deg,#1d1f3f,#16172b);overflow:hidden;display:flex;gap:16px;align-items:flex-start}
.hero:before{content:'';position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(124,123,230,.14)}
.hero:after{content:'';position:absolute;right:30px;bottom:-60px;width:130px;height:130px;border-radius:50%;background:rgba(124,123,230,.08)}
.hero .avc{width:70px;height:70px;font-size:24px}.hero h3{margin:0;font-size:21px}.hero>div{position:relative;z-index:1}
.big{background:linear-gradient(135deg,#7b78e6,#4f46b8);border-radius:24px;padding:20px;color:#fff;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(90,80,210,.35)}
.big:before{content:'';position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.1)}
.big small{letter-spacing:.8px;font-weight:600;opacity:.85}.big .n{font-size:46px;font-weight:700;line-height:1.1;margin:4px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px;text-align:center}
.tile b{display:block;font-size:20px}.tile span{font-size:11px;letter-spacing:.6px;opacity:.85;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 8px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--pri);font-weight:700}.stat.g b{color:var(--green)}.stat.a b{color:var(--amber)}.stat.r b{color:var(--red)}
.stat span{font-size:11px;letter-spacing:.7px;color:var(--muted);text-transform:uppercase}
.sec{display:flex;align-items:center;gap:8px;margin:20px 2px 10px;color:var(--muted);font-size:12.5px;letter-spacing:1.2px;font-weight:600;text-transform:uppercase}.sec .sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sub{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;min-height:150px;cursor:pointer;overflow:hidden}
.sub .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:var(--card2);border:1px solid var(--line2)}
.sub .t{font-size:17px;font-weight:600;margin:12px 0 8px}.sub .go{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:var(--priSoft);color:var(--pri);display:grid;place-items:center}
/* buttons */
.btn{border:0;cursor:pointer;border-radius:16px;padding:14px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#6a6ee8,#8a7fe6);color:#fff;box-shadow:0 8px 22px rgba(106,110,232,.35);transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.55}.btn.block{width:100%}
.btn.rose{background:linear-gradient(135deg,#a8385c,#8a2e4d);box-shadow:0 8px 22px rgba(168,56,92,.35)}.btn.amber{background:linear-gradient(135deg,#f6b445,#e0861d);box-shadow:0 8px 22px rgba(224,134,29,.3)}
.btn.green{background:linear-gradient(135deg,#2fb67f,#1f9468);box-shadow:none}.btn.ghost{background:var(--card);border:1px solid var(--line2);color:var(--text);box-shadow:none}
.btn.danger{background:var(--redSoft);border:1px solid rgba(229,72,77,.5);color:var(--red);box-shadow:none}.btn.sm{padding:9px 14px;font-size:13.5px;border-radius:13px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.acts .btn{flex-direction:column;gap:5px;padding:12px 8px;font-size:13px}.acts .btn i{font-size:20px}
.fab{position:absolute;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:15;width:58px;height:58px;border-radius:20px;font-size:26px;padding:0}
/* forms */
.inp,.sel,.ta{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:13px 14px;outline:none}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--priSoft)}.ta{min-height:90px;resize:vertical}
.search{position:relative;margin-bottom:12px}.search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:18px}.search .inp{padding-left:42px}
.fld{margin-bottom:14px}.fld label{display:block;font-size:12.5px;color:var(--muted);margin:0 2px 6px;letter-spacing:.4px}.fld .hint{font-size:12px;color:var(--dim);margin-top:5px}
.chk{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line2);border-radius:14px;background:var(--bg2)}.chk input{width:20px;height:20px;accent-color:var(--pri)}
.msel{display:flex;flex-wrap:wrap;gap:8px}.msel label{display:flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line2);border-radius:999px;font-size:13.5px;background:var(--bg2);cursor:pointer}.msel input{accent-color:var(--pri)}
.sw{appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;transition:.2s;border:0;flex-shrink:0}.sw:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw:checked{background:var(--pri)}.sw:checked:after{left:23px}
/* sheet */
.ov{position:absolute;inset:0;background:rgba(3,4,12,.62);backdrop-filter:blur(5px);z-index:50;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--bg2);border:1px solid var(--line2);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:56px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 14px}.sheet h3{margin:0 0 4px;font-size:20px}.sheet .sub2{color:var(--muted);font-size:14px;margin-bottom:16px}
.sheet .foot{display:flex;gap:10px;margin-top:18px}.sheet .foot .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fade{from{opacity:0}}
.toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);z-index:90;background:linear-gradient(135deg,#a8385c,#7f2c4a);color:#fff;padding:13px 20px;border-radius:999px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;font-weight:600;max-width:92%;animation:fade .2s}
.toast.err{background:linear-gradient(135deg,#d03b40,#a82a30)}.toast.ok{background:linear-gradient(135deg,#2fb67f,#1f9468)}
.empty{text-align:center;color:var(--dim);padding:44px 20px}.empty i{font-size:42px;display:block;margin-bottom:10px}
.lock{display:flex;gap:14px;align-items:center;border:1px solid rgba(229,72,77,.45);background:linear-gradient(135deg,rgba(229,72,77,.18),rgba(229,72,77,.06));color:#ff6b70;border-radius:18px;padding:16px;margin-bottom:12px;font-weight:600}
.lock.ok{border-color:rgba(47,182,127,.5);background:var(--greenSoft);color:var(--green)}
/* chart */
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:6px}.bars div{flex:1;background:linear-gradient(#8a7fe6,#5f6df0);border-radius:6px 6px 2px 2px;min-height:4px;position:relative}
.bars div.z{background:var(--line2)}.axis{display:flex;gap:6px;margin-top:6px}.axis span{flex:1;text-align:center;font-size:10.5px;color:var(--dim)}
.prog{height:9px;border-radius:9px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#2fb67f,#7ad8b0)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.kv:last-child{border:0}.kv span{color:var(--muted)}.kv b{font-weight:600;text-align:right;word-break:break-word}
.more{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.more .sub{min-height:116px}
.more-i{display:flex;gap:12px;align-items:center;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;cursor:pointer}.more-i i{font-size:24px;color:var(--pri);width:44px;height:44px;border-radius:14px;background:var(--priSoft);display:grid;place-items:center}.more-i b{display:block;font-size:15px}.more-i span{font-size:12px;color:var(--muted)}
.lg{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px}.lg:last-child{border:0}.lg .d{width:34px;height:34px;border-radius:50%;background:var(--priSoft);color:var(--pri);display:grid;place-items:center;flex-shrink:0}
.lg b{display:block;font-weight:600}.lg span{color:var(--muted);font-size:12.5px}
.gate{margin:auto;text-align:center;padding:30px;max-width:340px}.gate i{font-size:54px;color:var(--pri)}
.skl{height:84px;border-radius:22px;margin-bottom:12px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
/* hardening: nothing may push the layout wider than the screen */
*{min-width:0}.more{grid-template-columns:repeat(2,minmax(0,1fr))}.stats,.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.more-i{overflow:hidden}.more-i b,.more-i span{overflow-wrap:anywhere}.more-i>div{min-width:0}.kv b,.kv span,.lg b,.lg span,.card,.chip{overflow-wrap:anywhere}.chips{min-width:0}.acts{grid-template-columns:repeat(auto-fit,minmax(min(130px,100%),1fr))}main{overflow-x:hidden}
@media (max-width:360px){.stat b{font-size:22px}.big .n{font-size:38px}.more-i{padding:12px;gap:10px}.more-i i{width:38px;height:38px;font-size:20px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="../shared/icons.js"></script>
<script src="icons-hydrate.js"></script>

<script src="app.js"></script>
</body>
</html>
