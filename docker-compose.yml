# Run on any VPS / AWS EC2:  cp .env.example .env  (fill it)  →  docker compose up -d --build
# Caddy gets a free HTTPS certificate automatically for DOMAIN (Telegram Mini Apps need https).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: { DATA_DIR: /data, PORT: "3000" }
    volumes: [ "studymate-data:/data" ]
    expose: [ "3000" ]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: [ "80:80", "443:443" ]
    environment: { DOMAIN: "${DOMAIN}" }
    command: caddy reverse-proxy --from ${DOMAIN} --to app:3000
    volumes: [ "caddy-data:/data" ]
    depends_on: [ app ]
volumes:
  studymate-data:
  caddy-data:
